<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Martian Meal Planner</title>
  <meta name="theme-color" content="#2c1450">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Martian Meals">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="space" aria-hidden="true"><div class="stars"></div><div class="stars s2"></div><div class="ufo">🛸</div></div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-icon" aria-hidden="true">👽</span>
      <div><h1>Martian Meal Planner</h1><p id="week-label">Plan this week’s dinners</p></div>
    </div>
    <nav class="progress" id="progress" aria-label="Planning progress"></nav>
    <div class="actions">
      <button id="btn-export" class="btn btn-small" hidden>📤 Export week</button>
      <button id="btn-plan" class="btn btn-yellow btn-small" hidden></button>
      <button id="btn-settings" class="icon-btn" aria-label="Settings" title="Settings">⚙️</button>
    </div>
  </header>

  <main class="stage">
    <div class="scene-wrap" id="scene-wrap">
      <svg id="scene" viewBox="0 0 1254 1254" xmlns="http://www.w3.org/2000/svg" aria-label="Your kitchen. Glowing things can be tapped."></svg>
    </div>
  </main>

  <div id="modal-root"></div>
  <div id="print-root" aria-hidden="true"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
